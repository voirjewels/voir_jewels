<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#130E17">
  <title>VoirJewels Admin</title>
  <style>
    /* Phone and tablet friendly tweaks for the Decap CMS screens. Selectors match on class-name fragments so a CMS update cannot break the page. */
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
    /* 16px inputs stop iPhone from zooming the page when a field is tapped */
    input,textarea,select{font-size:16px!important}
    textarea{min-height:110px}
    img{max-width:100%}
    button{touch-action:manipulation}
    [class*="AppHeaderContent"]{overflow-x:auto;scrollbar-width:none}
    [class*="AppHeaderContent"]::-webkit-scrollbar{display:none}

    @media (max-width:1024px){
      [class*="AppMainContainer"]{min-width:0!important;max-width:100vw}
      [class*="SidebarContainer"]{width:auto!important;max-width:100vw}
      [class*="CollectionMain"]{padding-left:0!important}
    }
    @media (max-width:800px){
      /* the sidebar becomes a horizontal strip of categories above the list */
      [class*="SidebarContainer"]{position:static!important;width:100%!important;max-height:none!important;padding:8px 0!important;box-shadow:none!important}
      [class*="SidebarContainer"] ul{display:flex!important;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:0 12px 6px;scrollbar-width:none}
      [class*="SidebarContainer"] ul::-webkit-scrollbar{display:none}
      [class*="SidebarContainer"] li{flex:0 0 auto}
      [class*="SidebarContainer"] a{white-space:nowrap;border-left:0!important;border-radius:99px!important;padding:8px 14px!important}
      [class*="CollectionContainer"]{flex-direction:column!important;padding:0 12px!important}
      [class*="CollectionMain"]{width:100%!important;max-width:100%!important;margin:0!important;padding:0!important}
      /* editor fills the screen, fields stack, buttons are easy to hit */
      [class*="EditorContainer"],[class*="ControlPaneContainer"]{width:100%!important;max-width:100%!important;min-width:0!important}
      [class*="ControlPaneContainer"]{padding:12px!important}
      [class*="EditorToolbar"],[class*="ToolbarContainer"]{flex-wrap:wrap;height:auto!important;gap:8px;padding:8px 12px!important}
      [class*="ToolbarSectionMain"]{flex-wrap:wrap;gap:8px}
      [class*="Toolbar"] button{min-height:44px;padding-left:14px;padding-right:14px}
      [class*="ListItemTopBar"]{min-height:48px}
      [class*="ObjectWidgetTopBar"],[class*="ListItemTopBar"]{padding:6px 8px}
      [class*="StyledListItem"],[class*="ListItem"]{max-width:100%}
      [class*="ImageWidget"] img{max-height:220px;object-fit:contain}
      [class*="MediaLibraryModal"],[class*="LibraryTop"]{max-width:100vw!important}
      [class*="MediaLibraryModal"]{width:100vw!important;height:100dvh!important;max-height:100dvh!important;border-radius:0!important;inset:0!important}
      [class*="CardsGrid"]{justify-content:center}
      [class*="Card"]{max-width:100%}
      [class*="ModalContent"],[class*="PopupContainer"]{max-width:92vw!important}
    }
    @media (max-width:480px){
      [class*="LoginButton"],[class*="AuthenticationPage"] button{width:100%}
      [class*="AppHeader"] [class*="Button"]{min-height:40px}
    }

  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
